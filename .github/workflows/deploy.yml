name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Fast quality gates
        run: pnpm quality:fast

      - name: Build static site
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /ami-amis-website
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/ami-amis-website', github.repository_owner) }}

      - name: Route, interaction, accessibility, reflow and motion checks
        run: pnpm test:smoke && pnpm test:content && pnpm test:interaction && pnpm test:a11y && pnpm test:zoom && pnpm test:reduced-motion
        env:
          CI: "true"
          TEST_BASE_PATH: /ami-amis-website

      - name: Representative visual captures
        run: pnpm test:visual
        env:
          CI: "true"
          TEST_BASE_PATH: /ami-amis-website

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
